name: Strong Material Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install feedparser

      - name: Scan and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_MIN_SCORE: "4"
          LOOKBACK_MINUTES: "20"
        run: python notify.py

      - name: Save notification history
        run: |
          if [ -n "$(git status --porcelain -- .notification_state.json)" ]; then
            git config user.name "news-alert-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .notification_state.json
            git commit -m "Update notification history"
            git push
          fi
